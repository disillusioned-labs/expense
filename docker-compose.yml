services:
  api:
    container_name: expense-api
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env
      - .env.compose
    ports:
      - "8081:8081"
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

  grpc:
    container_name: expense-grpc
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env
      - .env.compose
    entrypoint: ["/app/grpc"]
    ports:
      - "9091:9091"
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

  consumer:
    container_name: expense-consumer
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env
      - .env.compose
    entrypoint: ["/app/consumer"]
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

  worker:
    container_name: expense-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env
      - .env.compose
    entrypoint: ["/app/worker"]
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

networks:
  data:
    external: true
    name: data

  messaging:
    external: true
    name: messaging

  observability:
    external: true
    name: observability
